name: release

# Publishing runs only from main, and only after the same checks the ci workflow
# runs. The job re-runs them rather than trusting a sibling workflow, because two
# workflows triggered by the same push do not order themselves.
on:
  push:
    branches: [main]

# One release at a time. Two concurrent runs would race on the version commit and
# on the registry.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  # Nothing is written back to the repository any more: versioning happens in a
  # normal commit, so the job only needs to read the code and mint an OIDC token.
  contents: read
  # Lets GitHub mint the OIDC token that npm trusted publishing exchanges for a
  # short lived credential. No long lived npm token is stored anywhere.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Trusted publishing has to be configured on npmjs.com for each package
      # before it can work, and that cannot be done until the package exists.
      # Set the repository variable RELEASE_ENABLED to true once both packages
      # are published and both have a trusted publisher. Until then the release
      # step is skipped and this public repository stays green.
      RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Changesets reads the history to work out what changed since the last
          # release, so a shallow clone is not enough.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # Writes the .npmrc that pnpm reads, wiring NODE_AUTH_TOKEN to the
          # registry. Without it the publish step is unauthenticated.
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # The demo resolves the packages through dist, so it builds after them, and
      # the end to end suite is the only proof that a tour works in a browser.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

      - if: env.RELEASE_ENABLED != 'true'
        run: echo "::warning::RELEASE_ENABLED is not true, so the release step is skipped and nothing is published."

      # actions/setup-node writes `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
      # into the npmrc it points NPM_CONFIG_USERCONFIG at. With no token set, the
      # client reads that line as "authentication is already configured", never
      # starts the OIDC exchange, and publishes with empty credentials, which the
      # registry rejects with a 404. Trusted publishing needs the line gone, while
      # the registry line the same file carries has to stay.
      - name: Drop the placeholder auth line so the OIDC exchange runs
        if: env.RELEASE_ENABLED == 'true'
        run: |
          set -eu
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
            echo "npmrc after cleanup:"
            cat "$NPM_CONFIG_USERCONFIG"
          else
            echo "::warning::NPM_CONFIG_USERCONFIG is not set, nothing to clean."
          fi

      # pnpm 10 does not perform the OIDC exchange that trusted publishing needs:
      # it simply asks to be logged in. npm does, from 11.5.1 onwards, so the
      # tarball is built by pnpm, which rewrites the workspace protocol into a real
      # version, and sent by npm, which authenticates. Versioning is done in the
      # repository beforehand, see INFRA.md.
      - name: Publish with npm trusted publishing
        if: env.RELEASE_ENABLED == 'true'
        run: |
          set -eu
          npm install -g npm@latest
          npm --version
          for dir in packages/*/; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on the registry, skipping."
              continue
            fi
            out=$(mktemp -d)
            (cd "$dir" && pnpm pack --pack-destination "$out" >/dev/null)
            echo "Publishing $name@$version"
            npm publish "$out"/*.tgz --access public --provenance
          done
